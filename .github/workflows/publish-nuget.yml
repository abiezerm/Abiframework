name: Publish to NuGet

# Release tags must be v<semver>, for example v8.0.1 or v8.1.0-preview.1.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish from main (for example 8.0.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write # NuGet trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Resolve version
      id: get_version
      env:
        EVENT_NAME: ${{ github.event_name }}
        GIT_REF: ${{ github.ref }}
        INPUT_VERSION: ${{ inputs.version }}
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          if [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "::error::Manual publishing is only allowed from main (got $GIT_REF)"
            exit 1
          fi
          VERSION="$INPUT_VERSION"
        else
          VERSION="${TAG_NAME#v}"
        fi
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Invalid package version '$VERSION' (expected SemVer such as 8.0.1)"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Publishing version: $VERSION"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.get_version.outputs.version }}

    - name: Test
      run: dotnet test --configuration Release --no-build

    - name: Pack
      run: dotnet pack src/AbiFramework/AbiFramework.csproj --configuration Release --no-build --output ./artifacts /p:Version=${{ steps.get_version.outputs.version }}

    - name: NuGet login (trusted publishing)
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: Abiezer # nuget.org profile that owns the trusted publishing policy

    - name: Publish to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
